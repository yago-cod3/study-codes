<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario</title>
  </head>
  <body>
    <h1>Formulario de inscricao</h1>
    <form>
      <div>
        <label for="nome">Nome</label>
        <input type="text" id="nome" />
      </div>
      <br />
      <div>
        <label for="email">E-mail</label>
        <input type="email" id="email" />
      </div>
      <br />
      <div>
        <label for="numero">WatsApp</label>
        <input type="tel" name="numero" placeholder="(85)988877665" />
      </div>
      <br />
      <div>
        <input type="radio" name="area" id="dev" value="dev" />
        <label for="dev">Desenvolvimento</label>

        <input type="radio" name="area" id="qa" value="qa" />
        <label for="qa">Qualidade</label>

        <input type="radio" name="area" id="an" value="an"/>
        <label for="an">analise de dados</label>

        <input type="radio" name="area" id="inf" value="inf" />
        <label for="inf">infraestrutura</label>
      </div>
      <br />
      <div>
        <label for="textarea">Observacoes:</label>
        <br />
        <textarea name="textarea"></textarea>
      </div>
      <br />
      <div>
        <input type="checkbox" name="desejo" id="desejo" />
        <label for="desejo">Desejo receber novidades e ofertas por email</label>
      </div>
      <br />

      <button type="submit">Enviar</button>
    </form>
  </body>
</html>
