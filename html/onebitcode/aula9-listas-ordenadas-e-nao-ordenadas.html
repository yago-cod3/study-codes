<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>listas ordenadas e nao ordenadas</title>
  </head>
  <body>
    <h1>Listas</h1>

    <h2>Ordenadas</h2>
    <ol>
      <li>caroo</li>
      <li>faca</li>
      <li>escada</li>
      <li>prato</li>
    </ol>

    <h2>Nao ordenadas</h2>
    <ul>
      <li>caroo</li>
      <li>faca</li>
      <li>escada</li>
      <li>prato</li>
    </ul>
    <!--podemos ulas listas dentro de lista ol, ul, li-->
  </body>
</html>
